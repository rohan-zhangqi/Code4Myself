<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>《稻草人》阅读计划</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #c8b89a;
      margin: 0;
    }

    /* Exact A4 at 150dpi for image export */
    .poster {
      width: 1240px;
      height: 1754px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(120, 90, 40, 0.015) 3px,
          rgba(120, 90, 40, 0.015) 4px
        ),
        radial-gradient(ellipse at 20% 15%, #fff6d6 0%, transparent 45%),
        radial-gradient(ellipse at 85% 20%, #d6f0ff 0%, transparent 40%),
        radial-gradient(ellipse at 50% 90%, #e8f8d8 0%, transparent 45%),
        linear-gradient(165deg, #fff9e8 0%, #f3ecd4 40%, #eaf5e0 100%);
      color: #2b2418;
    }

    /* Hand-drawn outer frame */
    .frame-outer {
      position: absolute;
      inset: 18px;
      border: 6px solid #e85d4c;
      border-radius: 8px 22px 10px 18px / 14px 10px 20px 8px;
      pointer-events: none;
      z-index: 5;
    }

    .frame-inner {
      position: absolute;
      inset: 30px;
      border: 3px dashed #3aa87a;
      border-radius: 16px 8px 20px 12px / 10px 18px 8px 16px;
      pointer-events: none;
      z-index: 5;
    }

    .frame-dots {
      position: absolute;
      inset: 42px;
      border: 2px solid #4a90c8;
      border-radius: 6px;
      pointer-events: none;
      z-index: 5;
      opacity: 0.55;
    }

    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 58px 64px 50px;
      display: flex;
      flex-direction: column;
    }

    /* Title banner */
    .title-wrap {
      text-align: center;
      position: relative;
      margin-bottom: 10px;
    }

    .title-banner {
      display: inline-block;
      background: #ff6b5a;
      color: #fffdf5;
      padding: 10px 48px 14px;
      border-radius: 40% 45% 42% 48% / 55% 50% 55% 50%;
      box-shadow:
        4px 5px 0 #f4c84a,
        inset 0 -3px 0 rgba(0,0,0,0.08);
      transform: rotate(-1.2deg);
      border: 3px solid #c93a2c;
    }

    .title-banner h1 {
      font-family: "Ma Shan Zheng", cursive;
      font-size: 72px;
      letter-spacing: 0.14em;
      line-height: 1.05;
      font-weight: 400;
    }

    .subtitle {
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: 28px;
      color: #2f7a5c;
      margin-top: 12px;
      letter-spacing: 0.35em;
      transform: rotate(0.6deg);
    }

    .meta-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin: 12px 0 8px;
      font-family: "ZCOOL QingKe HuangYou", "Noto Sans SC", sans-serif;
      font-size: 18px;
    }

    .chip {
      padding: 4px 14px;
      border-radius: 999px;
      border: 2px solid currentColor;
      background: #fff;
      transform: rotate(-1deg);
    }

    .chip:nth-child(1) { color: #d35400; transform: rotate(1deg); background: #ffe8d6; }
    .chip:nth-child(2) { color: #1e88a8; transform: rotate(-1.5deg); background: #dff4fb; }
    .chip:nth-child(3) { color: #2e8b57; transform: rotate(0.8deg); background: #e4f7ea; }
    .chip:nth-child(4) { color: #b8860b; transform: rotate(-0.5deg); background: #fff4c8; }

    .intro {
      text-align: center;
      font-family: "Noto Sans SC", sans-serif;
      font-size: 16px;
      color: #4a4030;
      line-height: 1.55;
      margin: 4px 40px 12px;
    }

    /* Main layout: plan + side doodles */
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 210px;
      gap: 16px;
      min-height: 0;
    }

    .plan-card {
      background: rgba(255, 255, 255, 0.72);
      border: 3px solid #5a8f6a;
      border-radius: 18px 8px 20px 12px / 12px 18px 8px 16px;
      padding: 12px 14px 10px;
      position: relative;
      box-shadow: 5px 6px 0 rgba(90, 143, 106, 0.25);
    }

    .plan-card::before {
      content: "阅读日程表";
      position: absolute;
      top: -16px;
      left: 28px;
      background: #4a90c8;
      color: #fff;
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: 20px;
      padding: 3px 16px;
      border-radius: 8px;
      border: 2px solid #2f6f9a;
      transform: rotate(-2deg);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 17px;
    }

    thead th {
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: 18px;
      padding: 8px 4px;
      color: #fff;
      background: #3d8b6e;
      border: 2px solid #2a6b52;
    }

    thead th:first-child { border-radius: 8px 0 0 0; }
    thead th:last-child { border-radius: 0 8px 0 0; }

    tbody td {
      padding: 7px 4px;
      text-align: center;
      border-bottom: 1.5px dashed #b8c9a8;
      font-family: "Noto Sans SC", sans-serif;
      font-weight: 500;
    }

    tbody tr:nth-child(odd) td { background: rgba(255, 214, 120, 0.22); }
    tbody tr:nth-child(even) td { background: rgba(140, 205, 180, 0.18); }

    td.num {
      font-family: "ZCOOL KuaiLe", cursive;
      color: #d35400;
      font-size: 18px;
      width: 8%;
    }

    td.date {
      width: 22%;
      color: #1e5f4a;
      font-size: 15px;
    }

    td.title {
      width: 28%;
      font-family: "Ma Shan Zheng", cursive;
      font-size: 24px;
      color: #2b2418;
      letter-spacing: 0.04em;
    }

    td.duration {
      width: 18%;
      color: #8a5a10;
      font-size: 15px;
    }

    td.status {
      width: 24%;
    }

    tbody td {
      height: 48px;
    }

    td.fill-line {
      position: relative;
    }

    td.fill-line::after {
      content: "";
      display: block;
      width: 86%;
      height: 0;
      margin: 0 auto;
      border-bottom: 1.5px dotted #c4b89a;
    }

    .tick-box {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 2.5px solid #e85d4c;
      border-radius: 4px;
      vertical-align: middle;
      background: #fff;
      transform: rotate(-3deg);
      box-shadow: 2px 2px 0 #f4c84a;
    }

    .blank-area {
      min-height: 72px;
      margin-top: 4px;
    }

    .blank-lines {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 8px 6px 4px;
    }

    .blank-lines i {
      display: block;
      height: 0;
      border-bottom: 1.5px dotted #b8a88a;
    }

    /* Side column decorations */
    .side {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .doodle-card {
      background: #fffdf5;
      border: 3px solid #e8b84a;
      border-radius: 40% 45% 42% 48% / 48% 42% 50% 45%;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 3px 4px 0 rgba(232, 184, 74, 0.35);
    }

    .doodle-card.green {
      border-color: #3aa87a;
      box-shadow: 3px 4px 0 rgba(58, 168, 122, 0.3);
      border-radius: 16px 28px 14px 24px / 22px 14px 26px 12px;
    }

    .doodle-card.blue {
      border-color: #4a90c8;
      box-shadow: 3px 4px 0 rgba(74, 144, 200, 0.3);
      border-radius: 24px 12px 28px 16px / 14px 24px 12px 22px;
    }

    .doodle-card h3 {
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: 20px;
      color: #d35400;
      margin-bottom: 6px;
    }

    .doodle-card.green h3 { color: #2e8b57; }
    .doodle-card.blue h3 { color: #1e88a8; }

    .doodle-card p {
      font-size: 14px;
      line-height: 1.55;
      color: #4a4030;
      font-family: "Noto Sans SC", sans-serif;
    }

    .scarecrow-art {
      width: 120px;
      height: 140px;
      margin: 0 auto 4px;
    }

    /* Floating doodles */
    .float {
      position: absolute;
      z-index: 3;
      pointer-events: none;
    }

    .float-sun { top: 70px; right: 78px; width: 70px; }
    .float-bird { top: 100px; left: 78px; width: 64px; }
    .float-wheat-l { bottom: 180px; left: 52px; width: 40px; }
    .float-wheat-r { top: 280px; right: 52px; width: 36px; }
    .float-flower1 { bottom: 90px; right: 70px; width: 48px; }
    .float-flower2 { bottom: 120px; left: 72px; width: 42px; }
    .float-star1 { top: 220px; left: 58px; width: 28px; }
    .float-star2 { top: 260px; right: 62px; width: 24px; }

    .footer {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 12px;
    }

    .tip-box {
      background: linear-gradient(135deg, #fff4c8, #ffe8d6);
      border: 3px solid #e85d4c;
      border-radius: 12px 20px 10px 18px / 16px 10px 18px 12px;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.55;
      font-family: "Noto Sans SC", sans-serif;
      color: #4a3020;
      position: relative;
    }

    .tip-box::before {
      content: "阅读小贴士";
      position: absolute;
      top: -13px;
      left: 16px;
      background: #ff6b5a;
      color: #fff;
      font-family: "ZCOOL KuaiLe", cursive;
      font-size: 16px;
      padding: 2px 12px;
      border-radius: 6px;
      border: 2px solid #c93a2c;
    }

    .sign-box {
      background: #eaf7f0;
      border: 3px solid #3aa87a;
      border-radius: 18px 10px 16px 12px / 10px 16px 10px 18px;
      padding: 12px 14px;
      font-size: 15px;
      font-family: "ZCOOL QingKe HuangYou", sans-serif;
      color: #2a4a38;
      line-height: 1.9;
    }

    .quote {
      text-align: center;
      margin-top: 10px;
      font-family: "Ma Shan Zheng", cursive;
      font-size: 20px;
      color: #1e88a8;
      letter-spacing: 0.06em;
    }

    .corner-sticker {
      position: absolute;
      width: 56px;
      height: 56px;
      z-index: 6;
      pointer-events: none;
    }

    .cs-tl { top: 36px; left: 36px; }
    .cs-tr { top: 36px; right: 36px; }
    .cs-bl { bottom: 36px; left: 36px; }
    .cs-br { bottom: 36px; right: 36px; }
  </style>
</head>
<body>

    <div class="frame-inner"></div>

    <div class="content">
      <header class="title-wrap">
        <div class="title-banner">
          <h1>《稻草人》</h1>
        </div>
        <p class="subtitle">阅 读 计 划</p>
        <div class="meta-row">

          <span class="chip">起始：10月20日</span>
